# main에 push하거나 PR을 열면 테스트와 빌드를 돌린다.
# main push에서 모두 통과하면 이미지를 GHCR에 올리고 운영에 배포한다(deploy.yml).
# 다만 마지막 운영 배포 뒤로 개발 도구·채점 규칙·모바일·문서만 바뀌었으면 이미지와 배포를 건너뛴다
# (scripts/dev/deploy-needed.sh).
# 운영 서버는 메모리가 작아서 빌드하지 않고, 여기서 만든 이미지를 받아 실행만 한다(docs/decisions/0015).
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-test:
    name: 백엔드 테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Gradle 테스트
        run: chmod +x gradlew && ./gradlew test --no-daemon
      - name: 실패한 테스트 보고서 보관
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: apps/backend/build/reports/tests/test
          retention-days: 7

  web-build:
    name: 웹 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: 웹 테스트
        run: npm run test --workspace @english-learning/frontend
      - run: npm run build --workspace @english-learning/frontend

  mobile-typecheck:
    name: 모바일 타입 검사·lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
        with:
          # 모델·그림 파일 테스트 일부가 옛 커밋의 파일(git show <커밋>:<경로>)과 비교하므로 기록이 모두 있어야 한다.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: 모바일 테스트
        run: npm run test

  # 임시 MySQL·Redis 컨테이너에서 빈 DB와 기존 DB(기준선 107) 양쪽으로 마이그레이션을 적용해 백엔드를 띄우고,
  # 뷰 조회와 운영 배포와 같은 방식의 백업(mysqldump)까지 확인한다. 단위 테스트는 DB를 띄우지 않아서
  # 마이그레이션 SQL과 엔티티·테이블 일치(ddl-auto: validate)는 여기서만 확인된다.
  db-migration-check:
    name: 마이그레이션 확인
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: 마이그레이션 확인
        # 단계에 시간 제한을 두면 시간 초과가 이 단계의 실패가 되어 아래 보관 단계가 확실히 돈다.
        timeout-minutes: 20
        run: |
          chmod +x apps/backend/gradlew
          bash scripts/dev/check-db-migrations.sh --out "$RUNNER_TEMP/db-check"
      - name: 실패한 확인 기록 보관
        # 시간 제한에 걸려 작업이 취소된 경우에도 남긴다.
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: db-migration-check
          path: ${{ runner.temp }}/db-check
          retention-days: 7

  config-lint:
    name: 설정 문법 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 워크플로 문법(actionlint)
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.7 -color
      - name: 운영 스크립트 문법(bash -n)
        run: |
          failed=0
          for f in scripts/ops/*.sh; do bash -n "$f" || { echo "FAIL $f"; failed=1; }; done
          exit $failed
      # 배포와 무관한 경로 목록을 잘못 넓히면, 그 push는 scripts/dev만 바뀌어 배포를 건너뛰고 뒤의 앱 변경이
      # 조용히 배포되지 않는다. 판단 스크립트를 바꾸는 push에서 바로 잡히게 여기서 시험한다.
      - name: 배포 판단 스크립트 테스트
        run: bash scripts/dev/tests/deploy-needed.test.sh

  feedback-rules-test:
    name: 피드백 채점 규칙 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: node --test scripts/feedback-quality/rules.test.mjs

  deploy-check:
    name: 배포 필요 판단
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 마지막 운영 배포 커밋과 비교하려면 기록이 모두 있어야 한다.
          fetch-depth: 0
      - name: 마지막 운영 배포와 비교해 판단
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 비교 시작 커밋은 마지막으로 운영 배포에 성공한 커밋이다. 직전 push가 배포됐다는 보장이 없어서(CI 실패,
          # 취소, 배포 실패) push 전 커밋과 비교하지 않는다. 찾지 못하면 빈 값이 되고 판단 스크립트가 배포로 정한다.
          base=$(bash scripts/dev/last-deployed-sha.sh "$GITHUB_REPOSITORY") || base=""
          # 스크립트가 실패하거나 결과를 읽지 못하면 배포한다.
          out=$(bash scripts/dev/deploy-needed.sh "$base" "$GITHUB_SHA") || out=""
          if [ "$(printf '%s\n' "$out" | head -1)" = "deploy=false" ]; then deploy=false; else deploy=true; fi
          reason=$(printf '%s\n' "$out" | sed -n 2p)
          [ -n "$reason" ] || reason="could not decide; deploying"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          {
            echo "### 배포 필요 판단"
            echo
            echo "- 비교 시작: ${base:-마지막 성공 배포를 찾지 못함}"
            echo "- deploy: $deploy"
            echo "- $reason"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "base=${base:-none} deploy=$deploy ($reason)"

  publish-images:
    name: 이미지 빌드·업로드
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy-check.outputs.deploy == 'true'
    needs: [backend-test, web-build, mobile-typecheck, feedback-rules-test, db-migration-check, config-lint, deploy-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 백엔드 이미지
        uses: docker/build-push-action@v7
        with:
          context: apps/backend
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/gyugyu1/writeloop-backend:${{ github.sha }}
            ghcr.io/gyugyu1/writeloop-backend:latest
          # 이미지를 이 저장소에 연결해 배포 작업의 GITHUB_TOKEN으로 받을 수 있게 한다.
          labels: |
            org.opencontainers.image.source=https://github.com/gyugyu1/writeLoop
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: 프론트엔드 이미지
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          # 운영 웹이 호출할 공개 API 주소. 빌드할 때 번들에 들어간다.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.writeloop.kr
          tags: |
            ghcr.io/gyugyu1/writeloop-frontend:${{ github.sha }}
            ghcr.io/gyugyu1/writeloop-frontend:latest
          # 이미지를 이 저장소에 연결해 배포 작업의 GITHUB_TOKEN으로 받을 수 있게 한다.
          labels: |
            org.opencontainers.image.source=https://github.com/gyugyu1/writeLoop
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: 운영 배포
    needs: publish-images
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
    secrets: inherit
