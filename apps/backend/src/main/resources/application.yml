server:
  port: 8080
  # 배포로 멈출 때 진행 중인 요청(LLM 피드백 등)을 끝까지 처리한다. 대기 한도는 spring.lifecycle에 있다.
  shutdown: graceful
  compression:
    enabled: ${SERVER_COMPRESSION_ENABLED:true}
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
    min-response-size: 1024
  servlet:
    session:
      timeout: 30m
      cookie:
        same-site: ${APP_SESSION_COOKIE_SAME_SITE:Lax}
        secure: ${APP_SESSION_COOKIE_SECURE:true}

spring:
  lifecycle:
    # nginx가 응답을 85초까지 기다리므로 그보다 조금 길게 둔다. docker-compose.yml의 stop_grace_period는 이보다 길어야 한다.
    timeout-per-shutdown-phase: 90s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/writeloop?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Seoul&forceConnectionTimeZoneToSession=true}
    username: ${SPRING_DATASOURCE_USERNAME:writeloop}
    password: ${SPRING_DATASOURCE_PASSWORD:writeloop}
    hikari:
      connection-init-sql: SET time_zone = '+09:00'
  jackson:
    time-zone: Asia/Seoul
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
          # 인증 코드 메일은 요청 처리 중에 보낸다. SMTP 서버가 멈춰도 요청이 무한정 기다리지 않게 한다(밀리초).
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  flyway:
    # 스키마 변경은 db/migration의 Flyway 버전 파일(V번호__설명.sql)로만 하며, 기동할 때 JPA 검증보다 먼저 적용한다.
    # 기존 DB는 infra/mysql/schema/001~107까지 손으로 적용돼 있으므로 107을 기준선으로 표시하고 108부터 적용한다.
    # 빈 DB는 V107__baseline.sql(운영 구조 덤프)부터 실행한다. 자세한 내용은 docs/decisions/0013.
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 107
    baseline-description: legacy infra/mysql/schema 001-107
  jpa:
    hibernate:
      # 엔티티와 DB 구조가 다르면 기동을 중단한다. 스키마는 Flyway 마이그레이션으로만 바꾼다.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
        type:
          preferred_instant_jdbc_type: TIMESTAMP

openai:
  api-key: ${OPENAI_API_KEY:}
  feedback-model: ${OPENAI_FEEDBACK_MODEL:${OPENAI_MODEL:gpt-6-luna}}
  diary-model: ${OPENAI_DIARY_MODEL:${OPENAI_MODEL:gpt-6-luna}}
  diary-reasoning-effort: ${OPENAI_DIARY_REASONING_EFFORT:${OPENAI_FEEDBACK_REASONING_EFFORT:}}
  # 시간 제한은 앱보다 짧아야 서버의 대체 응답이나 오류 안내가 앱에 닿는다.
  # 앱: 문장 피드백·영어일기 90초, 코치·Now in English 45초. nginx는 85초에서 끊는다.
  # 영어일기는 호출 한 번이고 재시도가 없다.
  diary-request-timeout-seconds: ${OPENAI_DIARY_REQUEST_TIMEOUT_SECONDS:75}
  coach-model: ${OPENAI_COACH_MODEL:${OPENAI_MODEL:gpt-6-luna}}
  coach-reasoning-effort: ${OPENAI_COACH_REASONING_EFFORT:${OPENAI_FEEDBACK_REASONING_EFFORT:}}
  # 코치 호출 한 번의 제한과, 코치 요청 하나가 모든 호출(슬롯 번역, 재시도 포함)에 쓸 수 있는 시간
  coach-request-timeout-seconds: ${OPENAI_COACH_REQUEST_TIMEOUT_SECONDS:40}
  coach-request-budget-seconds: ${OPENAI_COACH_REQUEST_BUDGET_SECONDS:40}
  # Now in English 코치 피드백과 하루 회고. 각각 호출 한 번이다.
  now-coach-feedback-request-timeout-seconds: ${OPENAI_NOW_COACH_FEEDBACK_REQUEST_TIMEOUT_SECONDS:40}
  now-reflection-request-timeout-seconds: ${OPENAI_NOW_REFLECTION_REQUEST_TIMEOUT_SECONDS:40}
  feedback-reasoning-effort: ${OPENAI_FEEDBACK_REASONING_EFFORT:}
  # 문장 피드백 호출 한 번의 제한과, 일시 오류·계약 위반 재시도를 포함한 요청 전체의 마감
  feedback-attempt-timeout-seconds: ${OPENAI_FEEDBACK_ATTEMPT_TIMEOUT_SECONDS:40}
  feedback-request-budget-seconds: ${OPENAI_FEEDBACK_REQUEST_BUDGET_SECONDS:80}
  api-url: ${OPENAI_API_URL:https://api.openai.com/v1/responses}

# 오류 추적(ADR-0018). DSN이 비어 있으면 아무것도 보내지 않는다(로컬, 테스트).
# 학습자 입력과 개인정보는 보내지 않는다: 요청 본문, IP, 쿠키, 사용자 정보를 빼고 오류 종류와 위치만 보낸다.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}
  # 이미지를 만든 커밋. CI가 이미지에 넣는다(apps/backend/Dockerfile).
  release: ${SENTRY_RELEASE:local}
  send-default-pii: false
  max-request-body-size: none
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: warn

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  auth:
    remember-me-days: ${APP_AUTH_REMEMBER_ME_DAYS:30}
    token-secret: ${APP_AUTH_TOKEN_SECRET:}
    access-token-minutes: ${APP_AUTH_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${APP_AUTH_REFRESH_TOKEN_DAYS:30}
    mobile-social-code-minutes: ${APP_AUTH_MOBILE_SOCIAL_CODE_MINUTES:5}
    mobile-redirect-prefixes: ${APP_AUTH_MOBILE_REDIRECT_PREFIXES:writeloop://}
  security:
    allow-insecure-dev-defaults: ${APP_SECURITY_ALLOW_INSECURE_DEV_DEFAULTS:false}
    csrf:
      enabled: ${APP_SECURITY_CSRF_ENABLED:true}
    headers:
      enabled: ${APP_SECURITY_HEADERS_ENABLED:true}
      hsts-max-age-seconds: ${APP_SECURITY_HEADERS_HSTS_MAX_AGE_SECONDS:31536000}
      content-security-policy: ${APP_SECURITY_HEADERS_CONTENT_SECURITY_POLICY:default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'}
      referrer-policy: ${APP_SECURITY_HEADERS_REFERRER_POLICY:no-referrer}
      permissions-policy: ${APP_SECURITY_HEADERS_PERMISSIONS_POLICY:camera=(), microphone=(), geolocation=()}
    rate-limit:
      enabled: ${APP_SECURITY_RATE_LIMIT_ENABLED:true}
      cleanup-interval-ms: ${APP_SECURITY_RATE_LIMIT_CLEANUP_INTERVAL_MS:600000}
      stale-bucket-seconds: ${APP_SECURITY_RATE_LIMIT_STALE_BUCKET_SECONDS:7200}
      auth-window-seconds: ${APP_SECURITY_RATE_LIMIT_AUTH_WINDOW_SECONDS:300}
      auth-max-requests: ${APP_SECURITY_RATE_LIMIT_AUTH_MAX_REQUESTS:10}
      email-window-seconds: ${APP_SECURITY_RATE_LIMIT_EMAIL_WINDOW_SECONDS:600}
      email-max-requests: ${APP_SECURITY_RATE_LIMIT_EMAIL_MAX_REQUESTS:5}
      prompt-recommendation-window-seconds: ${APP_SECURITY_RATE_LIMIT_PROMPT_RECOMMENDATION_WINDOW_SECONDS:60}
      prompt-recommendation-max-requests: ${APP_SECURITY_RATE_LIMIT_PROMPT_RECOMMENDATION_MAX_REQUESTS:60}
      feedback-window-seconds: ${APP_SECURITY_RATE_LIMIT_FEEDBACK_WINDOW_SECONDS:60}
      feedback-max-requests: ${APP_SECURITY_RATE_LIMIT_FEEDBACK_MAX_REQUESTS:6}
      coach-help-window-seconds: ${APP_SECURITY_RATE_LIMIT_COACH_HELP_WINDOW_SECONDS:60}
      coach-help-max-requests: ${APP_SECURITY_RATE_LIMIT_COACH_HELP_MAX_REQUESTS:20}
      coach-usage-window-seconds: ${APP_SECURITY_RATE_LIMIT_COACH_USAGE_WINDOW_SECONDS:60}
      coach-usage-max-requests: ${APP_SECURITY_RATE_LIMIT_COACH_USAGE_MAX_REQUESTS:60}
      draft-save-window-seconds: ${APP_SECURITY_RATE_LIMIT_DRAFT_SAVE_WINDOW_SECONDS:60}
      draft-save-max-requests: ${APP_SECURITY_RATE_LIMIT_DRAFT_SAVE_MAX_REQUESTS:120}
  admin:
    emails: ${APP_ADMIN_EMAILS:}
  mail:
    from: ${APP_MAIL_FROM:no-reply@writeloop.local}
    from-name: ${APP_MAIL_FROM_NAME:WriteLoop}
  drafts:
    ttl-days: ${APP_DRAFT_TTL_DAYS:7}
    max-per-user: ${APP_DRAFT_MAX_PER_USER:50}
    max-payload-bytes: ${APP_DRAFT_MAX_PAYLOAD_BYTES:65536}
    max-text-chars: ${APP_DRAFT_MAX_TEXT_CHARS:4000}
  diary:
    max-content-chars: ${APP_DIARY_MAX_CONTENT_CHARS:4000}
  version:
    ios:
      latest: ${APP_VERSION_IOS_LATEST:1.0.2}
      minimum-supported: ${APP_VERSION_IOS_MINIMUM_SUPPORTED:1.0.0}
      store-url: ${APP_VERSION_IOS_STORE_URL:https://apps.apple.com/kr/app/%EB%9D%BC%EC%9D%B4%ED%8A%B8%EB%A3%A8%ED%94%84/id6763569959}
    android:
      latest: ${APP_VERSION_ANDROID_LATEST:1.0.1}
      minimum-supported: ${APP_VERSION_ANDROID_MINIMUM_SUPPORTED:1.0.0}
      store-url: ${APP_VERSION_ANDROID_STORE_URL:https://play.google.com/store/apps/details?id=kr.writeloop}
    optional-title-ko: ${APP_VERSION_OPTIONAL_TITLE_KO:새 버전이 나왔어요}
    forced-title-ko: ${APP_VERSION_FORCED_TITLE_KO:업데이트가 필요해요}
    optional-message-ko: ${APP_VERSION_OPTIONAL_MESSAGE_KO:더 안정적인 학습 경험을 위해 최신 버전으로 업데이트해 주세요.}
    forced-message-ko: ${APP_VERSION_FORCED_MESSAGE_KO:현재 버전에서는 일부 기능이 원활하지 않을 수 있어요. 업데이트 후 이용해 주세요.}
    release-notes-ko: ${APP_VERSION_RELEASE_NOTES_KO:안정성 개선과 사용성 개선이 포함되어 있어요.}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      authorization-uri: ${GOOGLE_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
      token-uri: ${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
      user-info-uri: ${GOOGLE_USER_INFO_URI:https://openidconnect.googleapis.com/v1/userinfo}
      redirect-uri: ${GOOGLE_REDIRECT_URI:}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      authorization-uri: ${KAKAO_AUTHORIZATION_URI:https://kauth.kakao.com/oauth/authorize}
      token-uri: ${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
      user-info-uri: ${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
      redirect-uri: ${KAKAO_REDIRECT_URI:}
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
      authorization-uri: ${NAVER_AUTHORIZATION_URI:https://nid.naver.com/oauth2.0/authorize}
      token-uri: ${NAVER_TOKEN_URI:https://nid.naver.com/oauth2.0/token}
      user-info-uri: ${NAVER_USER_INFO_URI:https://openapi.naver.com/v1/nid/me}
      redirect-uri: ${NAVER_REDIRECT_URI:}
    apple:
      audience: ${APPLE_CLIENT_ID:kr.writeloop}
      issuer: ${APPLE_ISSUER:https://appleid.apple.com}
      jwks-uri: ${APPLE_JWKS_URI:https://appleid.apple.com/auth/keys}
      # 회원 탈퇴 때 Apple 토큰 해지에 쓰는 Sign in with Apple 키. 비어 있으면 해지를 건너뛴다.
      # private-key는 .p8 파일 내용이다. 환경변수에는 줄바꿈을 \n으로 바꿔 한 줄로 넣는다.
      team-id: ${APPLE_TEAM_ID:}
      key-id: ${APPLE_KEY_ID:}
      private-key: ${APPLE_PRIVATE_KEY:}
      token-uri: ${APPLE_TOKEN_URI:https://appleid.apple.com/auth/token}
      revoke-uri: ${APPLE_REVOKE_URI:https://appleid.apple.com/auth/revoke}
