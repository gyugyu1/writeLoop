resolver 127.0.0.11 ipv6=off valid=30s;

# 응답 헤더와 오류 화면에 nginx 버전을 싣지 않는다.
server_tokens off;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/javascript
    application/json
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

server {
    listen 80;
    server_name api.writeloop.kr;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/letsencrypt/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80 default_server;
    server_name writeloop.kr app.writeloop.kr;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/letsencrypt/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://writeloop.kr$request_uri;
    }
}

server {
    listen 80;
    server_name www.writeloop.kr;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/letsencrypt/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://writeloop.kr$request_uri;
    }
}

# 인증서가 없는 이름(www, app, IP 주소 등)으로 온 HTTPS는 핸드셰이크를 거절한다.
# 없으면 첫 번째 443 서버(API)가 아무 이름이나 받아 API 인증서를 내준다.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_reject_handshake on;
}

# app은 예전 주소라 HTTPS로 와도 웹으로 보낸다.
# www는 DNS 기록이 없다. 기록을 만들고 인증서에 넣은 뒤 server_name에 더한다.
server {
    listen 443 ssl;
    http2 on;
    server_name app.writeloop.kr;

    ssl_certificate /etc/letsencrypt/live/writeloop.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/writeloop.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://writeloop.kr$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.writeloop.kr;

    ssl_certificate /etc/letsencrypt/live/writeloop.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/writeloop.kr/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        set $backend_upstream http://writeloop-backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 20s;
        proxy_send_timeout 120s;
        # 앱(피드백·일기 90초)보다 짧고, 서버의 요청 마감(피드백 80초, 일기 75초)보다 길다.
        proxy_read_timeout 85s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name writeloop.kr;

    ssl_certificate /etc/letsencrypt/live/writeloop.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/writeloop.kr/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 웹 보안 헤더. API는 백엔드(SecurityHeadersFilter)가 붙인다.
    # www·app은 인증서가 없어 HTTPS로 받을 수 없으므로 HSTS에 includeSubDomains를 넣지 않는다.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        set $frontend_upstream http://writeloop-frontend:3000;
        proxy_hide_header X-Powered-By;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
